services:
  - type: web
    name: reachinbox-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npx prisma db push && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: reachinbox-redis
          property: connectionString
      - key: FRONTEND_URL
        value: https://reachinbox-app-theta.vercel.app
      - key: SMTP_HOST
        value: smtp.ethereal.email
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: cyekcvklhync3xgu@ethereal.email
      - key: SMTP_PASS
        value: 3aBG5H9eHyRTEy96BR
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: "100"
      - key: MIN_DELAY_MS_BETWEEN_SENDS
        value: "2000"
      - key: WORKER_CONCURRENCY
        value: "3"
